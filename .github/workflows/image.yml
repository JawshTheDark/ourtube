name: Docker image

# Builds the server's image for x86 and ARM and publishes it to the GitHub Container Registry on every push to
# main (each release), tagged `latest` and with its version from package.json, so `docker compose pull` (or the
# update button in Dockge or Portainer) updates a server. Run it by hand from the Actions tab to publish again.
on:
  push:
    branches: [main]
    paths-ignore: ['mobile/**', 'docs/**', '**/*.md', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The frontend builds once on the runner's own platform (see the Dockerfile); only the runtime layer is
      # built per CPU.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/jawshthedark/ourtube:latest
            ghcr.io/jawshthedark/ourtube:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
